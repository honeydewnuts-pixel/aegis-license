<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AEGIS Licence Dashboard</title>
  <link rel="manifest" href="/dashboard/manifest.webmanifest" />
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <div id="app">
    <section id="view-login" class="view">
      <h1>AEGIS Licence</h1>
      <p class="muted">Admin access only. No licence data is shown until you sign in.</p>
      <form id="login-form">
        <label for="password">Dashboard token</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn primary">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="view-main" class="view" hidden>
      <header class="top">
        <div>
          <strong>AEGIS Licence</strong>
          <span id="stale-badge" class="badge" hidden>STALE</span>
        </div>
        <button type="button" id="btn-logout" class="btn ghost">Log out</button>
      </header>
      <nav class="tabs">
        <button type="button" data-tab="overview" class="tab active">Overview</button>
        <button type="button" data-tab="licences" class="tab">Licences</button>
        <button type="button" data-tab="health" class="tab">Health</button>
      </nav>
      <main>
        <div id="tab-overview" class="tab-panel">
          <div class="cards" id="overview-cards"></div>
          <p class="muted" id="overview-updated"></p>
        </div>
        <div id="tab-licences" class="tab-panel" hidden>
          <form id="search-form" class="search">
            <input id="q" type="search" placeholder="Search serial or plan" />
            <button type="submit" class="btn">Search</button>
          </form>
          <div id="licence-list" class="list"></div>
          <div id="licence-detail" class="detail" hidden></div>
        </div>
        <div id="tab-health" class="tab-panel" hidden>
          <div id="health-body" class="cards"></div>
        </div>
      </main>
    </section>
  </div>
  <script src="/dashboard/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/dashboard/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
